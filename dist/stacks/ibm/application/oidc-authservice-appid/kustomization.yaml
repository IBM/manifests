---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: istio-system
resources:
- ../../../../../common/oidc-client/oidc-authservice/overlays/ibm-storage-config
- service-account.yaml
- vs.yaml
commonLabels:
  app.kubernetes.io/component: oidc-authservice
  app.kubernetes.io/name: oidc-authservice
patches:
- path: sts-patch.yaml
configMapGenerator:
- name: oidc-authservice-parameters
  behavior: merge
  envs:
  - params.env
secretGenerator:
- name: oidc-authservice-client
  type: Opaque
  behavior: merge
  envs:
  - secret_params.env
